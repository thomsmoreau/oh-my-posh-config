"$schema": "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version: 3
console_title_template: "{{ .Folder }}"
final_space: true
palette:
  red: "#ea6962"
  green: "#a9b665"
  blue: "#7daea3"
  yellow: "#d8a657"
  magenta: "#d3869b"
  cyan: "#89b482"
  white: "#d4be98"
  black: "#1d2021"

blocks:
  # Block 1: Contains most segments, appears on the same line as command output ends
  - alignment: left
    type: prompt
    segments:
      - background: "#32302f"
        foreground: "#d4be98"
        style: powerline
        template: "{{ if .WSL }}WSL at{{ end }} {{.Icon}} "
        type: os
      - background: "#7daea3"
        foreground: "#1d2021"
        powerline_symbol: "\ue0b0"
        options:
          style: full
        style: powerline
        template: " {{ .Path }} "
        type: path
      - background: "#a9b665"
        background_templates:
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}#d8a657{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#ea6962{{ end }}"
          - "{{ if gt .Ahead 0 }}#d3869b{{ end }}"
          - "{{ if gt .Behind 0 }}#d3869b{{ end }}"
        foreground: "#1d2021"
        leading_diamond: "\ue0b6"
        powerline_symbol: "\ue0b0"
        options:
          branch_template: "{{ trunc 25 .Branch }}"
          branch_icon: "\uE0A0 "
          branch_identical_icon: "\u25CF"
        style: powerline
        template: " {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} \uf044 {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} \uf046 {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} \ueb4b {{ .StashCount }}{{ end }} "
        trailing_diamond: "\ue0b4"
        type: git
      - background: "#d8a657"
        foreground: "#1d2021"
        powerline_symbol: "\ue0b0"
        options:
          fetch_version: true
        style: powerline
        template: " \ue626 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
        type: go
      - background: "#d3869b"
        foreground: "#1d2021"
        powerline_symbol: "\ue0b0"
        options:
          fetch_version: true
        style: powerline
        template: " \ue624 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
        type: julia
      - background: "#89b482"
        foreground: "#1d2021"
        powerline_symbol: "\ue0b0"
        options:
          display_mode: files
          fetch_virtual_env: false
        style: powerline
        template: " \ue235 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
        type: python
      - background: "#ea6962"
        foreground: "#d4be98"
        powerline_symbol: "\ue0b0"
        options:
          display_mode: files
          fetch_version: true
        style: powerline
        template: " \ue791 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
        type: ruby
      - background: "#d4be98"
        foreground: "#1d2021"
        powerline_symbol: "\ue0b0"
        options:
          display_mode: files
        style: powerline
        template: " \uf0e7{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
        type: azfunc
      - background: "#32302f"
        foreground: "#ea6962"
        powerline_symbol: "\ue0b0"
        style: powerline
        template: " \uf0ad "
        type: root
  # Block 1b: p10k-style right-aligned status / execution time / clock
  - alignment: right
    type: prompt
    segments:
      - type: status
        style: plain
        foreground: "#a9b665"
        foreground_templates:
          - "{{ if gt .Code 0 }}#ea6962{{ end }}"
        template: "{{ if gt .Code 0 }}\uf00d {{ .Code }}{{ else }}\uf00c{{ end }} "
      - type: executiontime
        style: plain
        foreground: "#d4be98"
        options:
          threshold: 1000
        template: " \uf252 {{ .FormattedMs }} "
      - type: time
        style: plain
        foreground: "#89b482"
        options:
          format: "15:04:05"
        template: " \uf017 {{ .CurrentDate | date .Format }} "

  # Block 2: Forces a newline and displays the prompt symbol
  - alignment: left
    newline: true # This block will start on a new line
    type: prompt
    segments:
      - foreground: p:green # Using a color from your palette
        style: plain
        template: ">> " # A common prompt symbol, adjust if you prefer something else (e.g., "> ")
        type: text # Using a text segment for the symbol

# Added transient prompt configuration (kept from your working transient config)
transient_prompt:
  background: transparent
  foreground: p:green
  template: "-> " # Or "{{ .Folder }}> " or similar, based on your preference

# p10k instant-prompt style: continuation lines get the same arrow
secondary_prompt:
  foreground: p:green
  template: "-> "